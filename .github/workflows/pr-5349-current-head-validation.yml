name: PR 5349 Railpack Integration Diagnosis
on:
  push:
    branches:
      - ci/pr-5349-railpack-skip-investigation
permissions:
  contents: read
jobs:
  focused-railpack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.4.0
          cache: pnpm
      - name: Install Railpack
        run: |
          curl -fsSL https://railpack.com/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          railpack --version
      - name: Initialize Docker Swarm
        run: |
          docker swarm init
          docker network create --driver overlay dokploy-network || true
      - run: pnpm install --frozen-lockfile
      - run: pnpm server:build
      - name: Run actual Railpack integration scenario only
        run: pnpm --filter dokploy exec vitest run --config __test__/vitest.config.ts __test__/deploy/application.real.test.ts -t 'should REALLY build with railpack'
